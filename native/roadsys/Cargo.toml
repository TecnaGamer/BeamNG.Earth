[package]
name = "roadsys"
version = "0.1.0"
edition = "2021"
description = "The road surface + bridge rewrite (BNE_ROADSYS): lane graph, planar partition, one profile per carriageway, markings, the M0 audit. A library linked into earthfast, and a CLI (the PT3 runner, the wide corpus audit)."

[lib]
name = "roadsys"
path = "src/lib.rs"

[[bin]]
name = "roadsys"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
debug = false
codegen-units = 1
