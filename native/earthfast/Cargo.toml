[package]
name = "earthfast"
version = "0.1.0"
edition = "2021"
description = "BeamNG.Earth's world server: geometry kernels in Rust (the hot Python loops; server/fast.py falls back to Python)"
license = "MIT"

[lib]
name = "earthfast"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310"] }
numpy = "0.25"
# GPU compute (gpu.rs): the per-pixel image work moved off the CPU when a GPU is there (Vulkan / DX12 / Metal)
wgpu = { version = "25", default-features = false, features = ["wgsl", "vulkan", "dx12", "metal"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
# LAZ point clouds (roadz.rs: USGS 3DEP's EPT nodes for bridge decks); laz-rs, pure Rust, Apache-2.0
laz = { version = "0.13", default-features = false }
# The finished imagery tiles' JPEGs decoded inside the far-texture warp (fartex.rs: no GIL hand-over per tile);
# zune-jpeg, pure Rust, MIT / Apache-2.0 / Zlib
zune-jpeg = "0.5"
# Compressed shapes (cdaez.rs: the game reads .cdae bodies as one zstd frame); zstd, MIT / Apache-2.0 (libzstd: BSD)
zstd = { version = "0.13", default-features = false }
# Stable traffic-piece priority, compatible with the original route stream's BLAKE2s-64 priorities.
blake2 = "0.10"
# Coupled road profiles: native sparse convex QP solver (Apache-2.0); no BLAS or Python optimizer at runtime.
clarabel = { version = "0.11.1", default-features = false, features = ["serde"] }
# The direction signs' faces drawn in the kernel (dirsigns_face.rs): glyphs rasterised by fontdue (pure Rust, MIT /
# Apache-2.0), the picture encoded by png (pure Rust, MIT / Apache-2.0)
fontdue = "0.9"
png = "0.17"
# The Add-ons page's README and release notes as safe HTML (mdhtml.rs: our own tags from the parser's events, no raw
# HTML passed through); pulldown-cmark, pure Rust, MIT
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# tools/build_native.py --fast: development iterations only (no LTO, parallel codegen, incremental): the shipped and
# committed modules are always [profile.release] builds
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[target.'cfg(windows)'.dependencies]
pyo3 = { version = "0.25", features = ["generate-import-lib"] }   # links python3.dll without a Python install (cross builds)
