[package]
name = "earthfast"
version = "0.1.0"
edition = "2021"
description = "BeamNG.Earth's world server: geometry kernels in Rust (the hot Python loops; server/fast.py falls back to Python)"
license = "MIT"

[lib]
name = "earthfast"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
numpy = "0.30"
# GPU compute (gpu.rs): the per-pixel image work moved off the CPU when a GPU is there (Vulkan / DX12 / Metal)
wgpu = { version = "25", default-features = false, features = ["wgsl", "vulkan", "dx12", "metal"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
# LAZ point clouds (roadz.rs: USGS 3DEP's EPT nodes for bridge decks); laz-rs, pure Rust, Apache-2.0
laz = { version = "0.13", default-features = false }
# The finished imagery tiles' JPEGs decoded inside the far-texture warp (fartex.rs: no GIL hand-over per tile);
# zune-jpeg, pure Rust, MIT / Apache-2.0 / Zlib
zune-jpeg = "0.5"
# Compressed shapes (cdaez.rs: the game reads .cdae bodies as one zstd frame); zstd, MIT / Apache-2.0 (libzstd: BSD)
zstd = { version = "0.13", default-features = false }
# Stable traffic-piece priority, compatible with the original route stream's BLAKE2s-64 priorities.
blake2 = "0.10"
# Coupled road profiles: native sparse convex QP solver (Apache-2.0); no BLAS or Python optimizer at runtime.
clarabel = { version = "0.11.1", default-features = false, features = ["serde"] }
# The direction signs' faces drawn in the kernel (dirsigns_face.rs): glyphs rasterised by fontdue (pure Rust, MIT /
# Apache-2.0), the picture encoded by png (pure Rust, MIT / Apache-2.0)
fontdue = "0.9"
png = "0.17"
# The Add-ons page's README and release notes as safe HTML (mdhtml.rs: our own tags from the parser's events, no raw
# HTML passed through); pulldown-cmark, pure Rust, MIT
pulldown-cmark = { version = "0.13", default-features = false }
# Overture's PMTiles (pmtiles.rs): gzip directories and tiles (flate2's pure-Rust miniz_oxide backend, MIT / Apache-2.0)
# and the tiles' JSON-string properties (serde_json, MIT / Apache-2.0); both were in the lock file already (png, clarabel)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
# Deterministic maths (dm.rs): sin / cos / atan2 / hypot / exp / pow ... in pure Rust, the same bits on every platform
# (the C library's differ between glibc versions, mingw and the UCRT: GitHub #1169). rust-lang's port of musl's libm,
# MIT; already in the lock file (num-traits); pinned. Reviewed 2026-11-12: no network, no file or process access, no
# unsafe beyond unchecked indexing and the x86 sqrt / fma instructions; build.rs only sets cfgs from cargo's env.
libm = "=0.2.16"
# The shared decision archives' signatures (decisions.rs: the builder signs, players verify before use): ed25519 by
# dalek-cryptography, pure Rust, BSD-3-Clause; sha2 (RustCrypto, MIT / Apache-2.0) for the bodies' hashes. 2026-11-13.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast"] }
sha2 = { version = "0.10", default-features = false }
# The mod's DDS textures made at install time from their lossless sources (texdds.rs): BC7 / BC5 / BC4 by texture-compressor
# (pure Rust, MIT / Apache-2.0; deterministic: its SSE4.1 / AVX2 kernels give the scalar bytes). Pinned. Reviewed
# 2026-11-13: no network, file or process access; unsafe only in its SIMD module (fixed-size array loads / stores and
# the checked CPU-feature dispatch); build.rs only writes two lookup tables into OUT_DIR; its one dependency is libm.
texture-compressor = "=0.2.4"
# The texture sources (texdds.rs): lossless WebP, ~25 % under PNG; image-webp (image-rs), pure Rust, MIT / Apache-2.0,
# forbid(unsafe_code), no file / network / process access, deps byteorder-lite and quick-error. Pinned. Reviewed 2026-11-13.
image-webp = "=0.2.4"

# The far textures' BC1 on the CPU (bc1fast.rs): Intel's ISPC Texture Compressor kernels (MIT) through intel_tex_2
# (Traverse Research, MIT / Apache-2.0), linked as the crate's prebuilt static libraries (no ISPC compiler: its "ispc"
# feature stays off). Pinned with its runtime ispc_rt (MIT) and num_cpus. Reviewed 2026-11-13: build.rs only prints
# link directives for src/ispc's libraries (no network, no file writes); the Rust is thin bindgen wrappers (unsafe only
# around the kernels' calls) and ispc_rt's task system (ISPCLaunch / ISPCAlloc / ISPCSync, which the BC kernels never
# call: their libraries' only outside symbols are memcpy / memset / abort / puts, and __chkstk / _fltused on Windows);
# num_cpus reads /proc and the cgroup files. No file, network or process access anywhere. Windows: release.yml builds
# for MSVC, which the crate's libraries are for; tools/build_native.py --windows (zig, windows-gnu) hands the same MSVC
# kernel libraries to the linker under the gnu names (they are COFF archives either way).
[target.'cfg(all(target_arch = "x86_64", any(target_os = "linux", windows)))'.dependencies]
intel_tex_2 = "=0.5.0"
ispc_rt = "=2.0.4"
num_cpus = "=1.17.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# tools/build_native.py --fast: development iterations only (no LTO, parallel codegen, incremental): the shipped and
# committed modules are always [profile.release] builds
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[target.'cfg(windows)'.dependencies]
pyo3 = { version = "0.30", features = ["generate-import-lib"] }   # links python3.dll without a Python install (cross builds)
