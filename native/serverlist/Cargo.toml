[package]
name = "bnge-serverlist"
version = "0.1.0"
edition = "2021"
description = "BeamNG.Earth's list of BeamMP servers: .earth servers announce themselves, the game's BeamNG.Earth tab reads the list"
license = "MIT"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
