# The player downloads: BeamNG.Earth-<VERSION>-x86_64.AppImage (Linux) and BeamNG.Earth-<VERSION>.exe (Windows),
# each the launcher (launcher.py: the mod, the world server, the game started for you) with Python inside.
# A push to main whose VERSION has no release yet builds both and publishes the release v<VERSION> (a pre-release
# when the version says "preview"); "Run workflow" builds them as artifacts only (or releases with release: true).
# Every push to dev builds a development build, the GitHub pre-release v<VERSION>.dev.<run number> (the user,
# 2026-10-30: "every push to dev would create a new pre-release"; VERSION itself only goes up with a beta): newer than
# the beta it follows and older than the next (server/updates.py), with a warning that it is not thoroughly tested;
# a development build's update check looks at these pre-releases.
name: release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the release v<VERSION> (when it does not exist yet)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}     # (a newer push to dev replaces the build under way)


# (the tests start servers through the launcher: never usage reports from CI, telemetry.py)
env:
  BNE_TELEMETRY: "off"

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
      dev: ${{ steps.v.outputs.dev }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          dev=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            # a development build: the beta's version and a number that only goes up ("1.7.2-beta.dev.37")
            case "$v" in *-*) v="$v.dev.${{ github.run_number }}";; *) v="$v-dev.${{ github.run_number }}";; esac
            dev=true
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "dev=$dev" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then exists=1; else exists=0; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            [ "${{ inputs.release }}" = "true" ] && [ $exists = 0 ] && pub=true || pub=false
          else
            [ $exists = 0 ] && pub=true || pub=false
            echo "build=$pub" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=$pub" >> "$GITHUB_OUTPUT"
          echo "VERSION $v, release exists: $exists, publish: $pub"

  # The thunder grain bank (native/weathersynth/assets/grains -> thunder_grains.bin, bank v3: 15.3 MB of raw i16): packed ONCE
  # here and handed to both platform jobs, so the AppImage and the .exe bundle byte-identical files. The pack decodes
  # the committed Ogg grains with ffmpeg's own Vorbis decoder (-c:a vorbis, float output; the i16 rounding is
  # weathersynth's); the decoder is Ubuntu 22.04's ffmpeg package, its version logged, and a sha256 other than the
  # committed one (packed with ffmpeg n9.0.2) is a warning: the sound is the same within a few LSB, but say so.
  grains:
    needs: [check, quality]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: ffmpeg (the pack's Vorbis decoder)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -1
      - name: Pack the grain bank
        working-directory: native/weathersynth
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          cargo build --release --locked
          target/release/weathersynth grainbank-pack --out thunder_grains.bin
          want=$(cut -d' ' -f1 assets/grains/thunder_grains.bin.sha256)
          got=$(sha256sum thunder_grains.bin | cut -d' ' -f1)
          echo "thunder_grains.bin sha256 $got"
          if [ "$got" != "$want" ]; then
            echo "::warning::thunder_grains.bin sha256 $got differs from the committed $want (another ffmpeg Vorbis decoder build: samples move by a few LSB; both platforms still get this one file)"
          fi
      # the live recorded rain / wind (assets/tex: CC0 blocks as Ogg -> tex_bank.bin, ~33 MB of raw i16), packed the
      # same way and handed on with the grains
      - name: Pack the texture bank
        working-directory: native/weathersynth
        run: |
          target/release/weathersynth texbank-pack --out tex_bank.bin
          want=$(cut -d' ' -f1 assets/tex/tex_bank.bin.sha256)
          got=$(sha256sum tex_bank.bin | cut -d' ' -f1)
          echo "tex_bank.bin sha256 $got"
          if [ "$got" != "$want" ]; then
            echo "::warning::tex_bank.bin sha256 $got differs from the committed $want (another ffmpeg Vorbis decoder build: samples move by a few LSB; both platforms still get this one file)"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: thunder-grains
          path: |
            native/weathersynth/thunder_grains.bin
            native/weathersynth/tex_bank.bin
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: [check, quality, grains]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-22.04          # an older glibc: the AppImage runs on more distributions
    steps:
      - uses: actions/checkout@v7
      - name: Development build's version
        if: needs.check.outputs.dev == 'true'
        run: printf '%s\n' "${{ needs.check.outputs.version }}" > VERSION
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rust kernels
        run: python tools/build_native.py
      - name: Grass patch (tools/gcpatch)
        run: sh tools/gcpatch/build.sh
      # the live weather sounds' synth (native/weathersynth, cpal output only; its crates fetched at Cargo.lock's
      # checksums for this target only); this runner's glibc is 2.35, the AppImage's limit; --check: GLIBC_2.35 at
      # most and libasound.so.2 linked dynamically (the player's own ALSA and its PipeWire / Pulse plugins)
      - name: Live weather sounds' synth (native/weathersynth)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libasound2-dev
          python tools/build_weathersynth.py --check
      - name: Python packages
        run: python -m pip install pyinstaller==6.22.3 -r server/requirements.txt
      - name: appimagetool
        run: |
          # a failed or half download once arrived as a non-program file (Exec format error, dev.248): retry until it is an ELF
          # (GitHub's release downloads answered 504 for ~2 min during the 1.9.0 build: ~10 min of tries before giving up)
          for i in 1 2 3 4 5 6 7 8; do
            curl -fsSL --retry 3 --retry-delay 5 -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
              && [ "$(head -c 4 appimagetool | od -An -tx1 | tr -d ' ')" = 7f454c46 ] && break
            echo "appimagetool download $i not an ELF, retrying"; sleep $((15 * i))
          done
          [ "$(head -c 4 appimagetool | od -An -tx1 | tr -d ' ')" = 7f454c46 ]
          chmod +x appimagetool
          mv appimagetool appimagetool.AppImage
      - name: The thunder grain bank (the grains job's one pack)
        uses: actions/download-artifact@v8
        with:
          name: thunder-grains
          path: build/weathersynth
      - name: Build the AppImage
        run: python tools/build_app.py --appimagetool "$PWD/appimagetool.AppImage" --require-weathersynth
      - name: Smoke test (the packaged server starts and answers --help)
        run: |
          f=$(ls dist/*.AppImage)
          "$f" --appimage-extract-and-run --server --help > help.txt
          grep -q -- "--near-visual" help.txt
          head -3 help.txt
          # the bundled synth where server/liveaudio.py looks, and it runs (its libasound.so.2 resolves to the system's)
          "$f" --appimage-extract > /dev/null
          ws=squashfs-root/usr/lib/BeamNG.Earth/_internal/weathersynth
          test -x "$ws"
          "$ws" storm-dump | head -2
          # the grain bank next to it, the grains job's file unchanged
          cmp squashfs-root/usr/lib/BeamNG.Earth/_internal/thunder_grains.bin build/weathersynth/thunder_grains.bin
          cmp squashfs-root/usr/lib/BeamNG.Earth/_internal/tex_bank.bin build/weathersynth/tex_bank.bin
          rm -rf squashfs-root
      - name: numpy starts with its AVX-512 targets held back (server/npyguard.py, -W error)
        run: |
          f=$(ls dist/*.AppImage)
          "$f" --appimage-extract-and-run --check-numpy
          "$f" --appimage-extract-and-run --check-mapillary
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    needs: [check, quality, grains]
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    # Azure Artifact Signing (the user, 2026-11-25): the GitHub environment "signing" (main and dev only) holds the
    # Azure ids as variables (no secret: the job signs in by OIDC through the app registration's federated credential
    # for this repository's "signing" environment, which has the Certificate Profile Signer role on the account)
    environment: signing
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SIGN: ${{ vars.AZURE_CLIENT_ID != '' }}     # (forks / an environment without the ids: unsigned)
    steps:
      - uses: actions/checkout@v7
      - name: Development build's version
        if: needs.check.outputs.dev == 'true'
        shell: bash
        run: printf '%s\n' "${{ needs.check.outputs.version }}" > VERSION
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rust kernels
        run: python tools/build_native.py
      - name: Live weather sounds' synth (native/weathersynth)
        run: python tools/build_weathersynth.py
      - name: Python packages
        run: python -m pip install pyinstaller==6.22.3 -r server/requirements.txt
      # PyInstaller's bootloader compiled here (MSVC) instead of the wheel's prebuilt one that antivirus heuristics
      # know (VirusTotal 2026-10-17: 2/60 on 1.4.35); build_app.py stops without it
      - name: Bootloader from source
        run: python tools/build_bootloader.py
      # The synth is signed before it is bundled: the one-file app extracts it and starts it as a process of its own,
      # which Smart App Control and antivirus judge by its own signature
      - name: Azure sign-in (OIDC, no secret)
        if: env.AZURE_SIGN == 'true'
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906   # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the synth (Azure Artifact Signing)
        if: env.AZURE_SIGN == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82   # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build\weathersynth
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-digest: SHA256
          description: BeamNG.Earth weather sounds
          description-url: https://github.com/TecnaGamer/BeamNG.Earth
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: The thunder grain bank (the grains job's one pack)
        uses: actions/download-artifact@v8
        with:
          name: thunder-grains
          path: build/weathersynth
      - name: Build the .exe
        run: python tools/build_app.py --require-own-bootloader --require-weathersynth
      # Signed through Azure Artifact Signing: a Public Trust certificate from a CA in Microsoft's trusted roots (the
      # publisher is the verified individual), so SmartScreen / Smart App Control build reputation on it (GitHub #823;
      # replaces the self-signed CN=BeamNG.Earth certificate). Timestamped by the service. Before the smoke tests, so
      # they run the signed file. Actions pinned to commits. (Signed in above, for the synth.)
      - name: Sign the .exe (Azure Artifact Signing)
        if: env.AZURE_SIGN == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82   # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-digest: SHA256
          description: BeamNG.Earth
          description-url: https://github.com/TecnaGamer/BeamNG.Earth
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Check the signature (valid, timestamped)
        if: env.AZURE_SIGN == 'true'
        shell: pwsh
        run: |
          foreach ($f in @(Get-ChildItem dist\*.exe) + @(Get-Item build\weathersynth\weathersynth.exe)) {
            $s = Get-AuthenticodeSignature $f.FullName
            if ($s.Status -ne 'Valid') { throw "$($f.Name): signature $($s.Status): $($s.StatusMessage)" }
            if (-not $s.TimeStamperCertificate) { throw "$($f.Name): no timestamp" }
            "signed $($f.Name) by $($s.SignerCertificate.Subject) (issuer $($s.SignerCertificate.Issuer)), timestamped"
          }
      - name: Smoke test (the packaged server starts and answers --help)
        shell: bash
        run: |
          f=$(ls dist/*.exe)
          "$f" --server --help > help.txt
          grep -q -- "--near-visual" help.txt
          build/weathersynth/weathersynth.exe storm-dump | head -2   # (the signed file the .exe bundles runs)
          sha256sum build/weathersynth/thunder_grains.bin            # (the same as the grains job's: one file for both)
          sha256sum build/weathersynth/tex_bank.bin
          head -3 help.txt
      - name: numpy starts with its AVX-512 targets held back (server/npyguard.py, -W error)
        shell: bash
        run: |
          f=$(ls dist/*.exe)
          "$f" --check-numpy
          "$f" --check-mapillary
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [check, linux, windows]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0              # (a development build's notes: the commits since the previous one)
      - uses: actions/download-artifact@v8
        with:
          path: out
      - name: Publish the development build v${{ needs.check.outputs.version }}
        if: needs.check.outputs.dev == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.check.outputs.version }}
          printf '%s\n' "$v" > VERSION
          python3 tools/package.py --beammp
          prev=$(gh release list --limit 50 --json tagName,isPrerelease \
                 -q '[.[] | select(.isPrerelease and (.tagName | test("dev\\.[0-9]+$")))][0].tagName' || true)
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then range="$prev..$GITHUB_SHA"
          else range="-20 $GITHUB_SHA"; fi
          {
            echo "> [!WARNING]"
            echo "> **Development build.** This version is built automatically from the \`dev\` branch and has **not been"
            echo "> thoroughly tested**: expect bugs, and things may change or break between builds. For a tested version,"
            echo "> use the latest beta release. Please report problems on [Discord](https://discord.gg/tgf) or in the"
            echo "> GitHub issues, with this version number ($v)."
            echo
            echo "**Download** the file for your system (Windows: \`BeamNG.Earth-$v.exe\`, Linux:"
            echo "\`BeamNG.Earth-$v-x86_64.AppImage\`), run it, and it does the rest. A development build's update"
            echo "check offers the next development build (or the next beta, when that is newer)."
            echo
            echo "### Changes since ${prev:-the last builds}"
            git log --no-merges --format='%s' $range | grep -v '^VERSION ' \
              | awk '{ if (length($0) > 200) $0 = substr($0, 1, 197) "..."; print "- " $0 }'
            if [ -n "$prev" ]; then
              echo
              echo "Full list of changes: https://github.com/${{ github.repository }}/compare/$prev...v$v"
            fi
          } > notes.md
          # every release's notes end with the launch steps (the user, 2026-11-04)
          { echo; echo "---"; echo; python3 tools/release_notes.py --launch-only "$v"; } >> notes.md
          gh release create "v$v" out/linux/* out/windows/* dist/BeamNG.Earth-BeamMP-Server-*.zip \
            --target "$GITHUB_SHA" --title "BeamNG.Earth $v (development build)" --notes-file notes.md --prerelease
          # only the newest DEV_KEEP development builds stay (the releases page has no filter: the betas got lost among
          # them, and the in-game update check reads the newest 30 releases only)
          DEV_KEEP=3
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            | jq -r --argjson keep "$DEV_KEEP" '[.[] | select(.isPrerelease and (.tagName | test("dev\\.[0-9]+$")))]
                | sort_by(.createdAt) | reverse | .[$keep:][] | .tagName' \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag || true; done
          # Older development builds stay downloadable from ONE release, "Development builds (archive)" (tag
          # dev-builds; the user, 2026-11-09: "easier for players to access older versions without filling up the
          # releases page"): each build's Windows .exe and Linux AppImage are added to it, its notes list the builds
          # newest first with their links, and only the newest ARCH_KEEP builds' files are kept. Not a version tag:
          # the in-game update check skips it (updates.parse). Never fails the build.
          ARCH=dev-builds; ARCH_KEEP=60
          (
            set -e
            if ! gh release view "$ARCH" >/dev/null 2>&1; then
              echo "Older development builds." > arch.md
              gh release create "$ARCH" --target "$GITHUB_SHA" --title "Development builds (archive)" \
                --notes-file arch.md --prerelease --latest=false
            fi
            gh release upload "$ARCH" out/windows/*.exe out/linux/*.AppImage --clobber
            # (the builds by their version, newest first; files past the newest ARCH_KEEP builds removed)
            gh release view "$ARCH" --json assets -q '.assets[].name' \
              | sed -nE 's/^BeamNG\.Earth-(.+)(\.exe|-x86_64\.AppImage)$/\1/p' | sort -u -V -r > arch_versions.txt
            tail -n +$((ARCH_KEEP + 1)) arch_versions.txt | while read -r old; do
              for f in "BeamNG.Earth-$old.exe" "BeamNG.Earth-$old-x86_64.AppImage"; do
                gh release delete-asset "$ARCH" "$f" --yes || true
              done
            done
            base="https://github.com/${{ github.repository }}/releases/download/$ARCH"
            {
              echo "> [!WARNING]"
              echo "> **Development builds** from the \`dev\` branch, not thoroughly tested. For a tested version use the"
              echo "> latest beta release. The newest is also the top \"development build\" pre-release."
              echo
              echo "Older development builds, newest first (the last $ARCH_KEEP are kept). Download the file for your"
              echo "system and run it; the changes of each build are in the \`dev\` branch's history."
              echo
              echo "| Build | Windows | Linux |"
              echo "|---|---|---|"
              head -n "$ARCH_KEEP" arch_versions.txt | while read -r ver; do
                echo "| $ver | [BeamNG.Earth-$ver.exe]($base/BeamNG.Earth-$ver.exe) | [AppImage]($base/BeamNG.Earth-$ver-x86_64.AppImage) |"
              done
              echo
              echo "---"
              echo
              python3 tools/release_notes.py --launch-only "$v"
            } > arch.md
            gh release edit "$ARCH" --notes-file arch.md --prerelease --latest=false
          ) || echo "::warning::the development builds archive was not updated"
      - name: Publish v${{ needs.check.outputs.version }}
        if: needs.check.outputs.dev != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.check.outputs.version }}
          python3 tools/package.py --beammp
          pre=""
          case "$v" in *preview*|*alpha*|*rc*) pre="--prerelease";; esac     # preserve upstream: betas are full releases
          cat > notes.md <<EOF
          **Download** the file for your system, run it, and it does the rest: it installs the mod into BeamNG.drive,
          starts the world server and starts the game. Then pick **Freeroam > BeamNG.Earth**.

          - **Windows:** \`BeamNG.Earth-$v.exe\` (Windows may warn about an unknown app: More info > Run anyway)
          - **Linux:** \`BeamNG.Earth-$v-x86_64.AppImage\` (make it executable: right-click > Properties, or
            \`chmod +x\`). It starts the native game with the grass patch, no Steam launch options needed.
          - **Hosting:** \`BeamNG.Earth-BeamMP-Server-$v.zip\` contains the Earth client mod and server plugin to install into a dedicated BeamMP server. Obtain the BeamMP server executable from its official releases; the player app's world companion is not the dedicated BeamMP server.

          Steam must be running. Closing the game stops the server. See the README for details.
          EOF
          { echo; echo "---"; echo; python3 tools/release_notes.py --launch-only "$v"; } >> notes.md
          gh release create "v$v" out/linux/* out/windows/* dist/BeamNG.Earth-BeamMP-Server-*.zip --target "$GITHUB_SHA" --title "BeamNG.Earth $v" \
            --notes-file notes.md --generate-notes $pre

  # the BeamMP server as a container image (docker/Dockerfile: the Linux host bundle), ghcr.io/<owner>/beamng.earth-server:
  # a release tagged with its version and latest (next: a preview); a development build as dev only (the releases keep 3
  # of those, the registry would keep every one)
  container:
    needs: [check, release]
    runs-on: ubuntu-latest
    # (the server image is extra: a failure here never marks a release that is already published as failed)
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Development build's version
        if: needs.check.outputs.dev == 'true'
        run: printf '%s\n' "${{ needs.check.outputs.version }}" > VERSION
      - id: tags
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/beamng.earth-server"
          v=${{ needs.check.outputs.version }}
          if [ "${{ needs.check.outputs.dev }}" = "true" ]; then tags="$image:dev"
          else
            case "$v" in *preview*|*alpha*|*rc*) moving=next;; *) moving=latest;; esac
            tags="$image:$v,$image:$moving"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: VERSION=${{ needs.check.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
