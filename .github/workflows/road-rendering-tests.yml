name: Road rendering worker checks

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/road-rendering-tests.yml'
  push:
    branches: [codex/upstream-road-rendering]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=duckdb -r server/requirements.txt
      - run: python -m unittest discover -s server/tests -p test_peerwork.py -v
      - run: python -m unittest discover -s server/tests -p test_blockworker.py -v
      - run: python -m unittest discover -s server/tests -p test_roads.py -v
