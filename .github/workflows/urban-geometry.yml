name: Urban geometry checks

on:
  pull_request:
  push:
    branches: [codex/upstream-urban-buildings]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urban-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generators:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --only-binary=duckdb -r server/requirements.txt
      - run: python tools/check_urban_geometry.py --report dist/urban-fallback-validation.json
      - run: python tools/build_native.py
      - run: python tools/check_urban_geometry.py --native --report dist/urban-native-validation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: urban-validation-${{ matrix.os }}
          path: dist/urban-*-validation.json
