name: foundation quality

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request replaces its run under way (issue #1273). Keyed on the PR number, not head_ref:
# fork PRs often share a branch name (patch-1). Called from release.yml (a push) or dispatched, there is no PR number:
# the run's own id, a group of its own, never cancelled, and never release.yml's release-<ref> (no caller deadlock).
concurrency:
  group: quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# (the tests start servers through the launcher: never usage reports from CI, telemetry.py)
env:
  BNE_TELEMETRY: "off"

jobs:
  kernels:
    name: earthfast unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test the Rust kernels
        # The shipped extension resolves Python symbols in its host. A standalone test binary needs libpython.
        run: |
          export RUSTFLAGS="-L native=$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))') -C link-arg=-lpython3.12 -C link-arg=-lstdc++"
          cargo test --locked --manifest-path native/earthfast/Cargo.toml --lib

  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Dependencies
        # SciPy is a test-only independent QP reference (PR #814); it is not a server requirement.
        # The Germany tests use the regional-data builder: zstandard is its Python <3.14 compression backend.
        run: python -m pip install -r server/requirements.txt lupa==2.8 scipy zstandard
      - name: OSM tag inventory
        run: python tools/build_taginfo.py --check
      - name: Verify the checked-in native module before rebuilding it
        working-directory: server/tests
        run: python -m unittest -q test_fast.RequireTest.test_shipped_kernel_meets_server_calls
      - name: Build required native kernels
        run: python tools/build_native.py
      - name: Foundation regression and package gate
        run: python tools/quality_gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-logs-${{ matrix.os }}
          path: build/quality-tests/*.log
          if-no-files-found: warn
