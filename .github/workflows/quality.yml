name: foundation quality

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read


# (the tests start servers through the launcher: never usage reports from CI, telemetry.py)
env:
  BNE_TELEMETRY: "off"

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencies
        # SciPy is a test-only independent QP reference (PR #814); it is not a server requirement.
        run: python -m pip install -r server/requirements.txt lupa==2.8 scipy
      - name: OSM tag inventory
        run: python tools/build_taginfo.py --check
      - name: Build required native kernels
        run: python tools/build_native.py
      - name: Foundation regression and package gate
        run: python tools/quality_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-logs-${{ matrix.os }}
          path: build/quality-tests/*.log
          if-no-files-found: warn
